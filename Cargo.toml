[package]
name = "docx-mcp-server"
version = "2.2.0"
edition = "2021"
description = "DOCX MCP Server — 80 tools for creating, reading, editing, and converting Word documents, with PDF export, KDP book layouts, and parameterized business templates"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/docx-mcp"
homepage = "https://zavora.ai"
keywords = ["mcp", "docx", "word", "document", "ai"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
exclude = [".cargo/"]

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
zavora-docx = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[workspace]
